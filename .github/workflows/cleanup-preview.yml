name: Cleanup Preview Deployments

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: elkobaptistchurchorg
      BRANCH: ${{ github.head_ref }}
    steps:
      - name: Delete preview deployments for this branch
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PROJECT}/deployments"

          echo "Looking for preview deployments on branch: ${BRANCH}"
          page=1
          found=0
          while :; do
            resp=$(curl -sf -H "Authorization: Bearer ${CF_API_TOKEN}" \
              "${api}?env=preview&per_page=100&page=${page}")

            ids=$(echo "$resp" | jq -r \
              --arg b "$BRANCH" \
              '.result[] | select(.deployment_trigger.metadata.branch == $b) | .id')

            count=$(echo "$resp" | jq '.result | length')
            if [ "$count" -eq 0 ]; then
              break
            fi

            for id in $ids; do
              echo "Deleting deployment ${id}"
              curl -sf -X DELETE -H "Authorization: Bearer ${CF_API_TOKEN}" \
                "${api}/${id}?force=true" > /dev/null
              found=$((found + 1))
            done

            page=$((page + 1))
          done

          echo "Deleted ${found} preview deployment(s) for branch ${BRANCH}."
